name: Remove partial 2015 from active analytics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rajac-remove-partial-2015
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Remove partial 2015 from active long-term archive
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python A_remove_partial_2015.py
          test ! -d public/cadastral-longterm/stats/2015
          cat public/cadastral-longterm/archive_2015_partial.json
          cat public/cadastral-longterm/audit.json
      - name: Regenerate 2,299 statistical cards without active 2015 index data
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python A_cadastral_statistical_cards.py
          test "$(find public/cadastral-statistics/cards -name '*.json' | wc -l)" -eq 2299
      - name: Final active-period audit
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('public/cadastral-longterm/stats')
          assert not (root/'2015').exists()
          a=json.load(open('public/cadastral-longterm/audit.json',encoding='utf-8'))
          assert a['years_present'][0]=='2016'
          assert a['index_year_files']==33
          print('FINAL OK:',a)
          PY
      - name: Commit removal and regenerated statistics
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/cadastral-longterm public/cadastral-statistics
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Exclude partial 2015 from active Sentinel analytics"
          for ATTEMPT in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 3
