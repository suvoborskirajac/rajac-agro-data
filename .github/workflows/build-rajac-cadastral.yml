name: Build Rajac cadastral Sentinel-2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим рада'
        type: choice
        options:
          - daily
          - backfill
        default: daily
        required: true
      start_date:
        description: 'Backfill почетак (YYYY-MM-DD)'
        default: '2026-01-01'
        required: false
      end_date:
        description: 'Backfill крај (YYYY-MM-DD); празно = данас'
        default: ''
        required: false
      force:
        description: 'Поново израчунај већ постојеће датуме'
        type: boolean
        default: false
        required: false
      batch_size:
        description: 'Број парцела у једном GEE reduceRegions пакету'
        default: '750'
        required: false
      max_scenes:
        description: 'Ограничење броја сцена; 0 = све'
        default: '0'
        required: false
  schedule:
    # 05:40 UTC = 07:40 CEST; намерно после постојећег Agro дневног workflow-а.
    - cron: '40 5 * * *'

permissions:
  contents: write

concurrency:
  group: rajac-cadastral-sentinel2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate cadastral input
        run: |
          python - <<'PY'
          import json
          p='public/boundaries/pio-rajac-cadastral-parcels.geojson'
          g=json.load(open(p,encoding='utf-8'))
          f=g.get('features',[])
          ids=[str(x.get('properties',{}).get('parcela_id','')) for x in f]
          assert len(f)==2299, f'Expected 2299 parcels, got {len(f)}'
          assert len(set(ids))==2299, 'parcela_id is not unique'
          assert all(ids), 'missing parcela_id'
          print('Cadastral input OK:',len(f),'parcels')
          PY

      - name: Run cadastral Sentinel-2 processor
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          START_DATE: ${{ github.event.inputs.start_date || '2026-01-01' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          FORCE_FLAG: ${{ github.event.inputs.force || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '750' }}
          MAX_SCENES: ${{ github.event.inputs.max_scenes || '0' }}
        run: |
          set -e
          ARGS="--scale 10 --batch-size $BATCH_SIZE --max-scenes $MAX_SCENES"
          if [ "$FORCE_FLAG" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$MODE" = "backfill" ]; then
            ARGS="$ARGS --start-date $START_DATE"
            if [ -n "$END_DATE" ]; then ARGS="$ARGS --end-date $END_DATE"; fi
          else
            ARGS="$ARGS --lookback-days 10"
          fi
          echo "python cadastral_processor.py $ARGS"
          python cadastral_processor.py $ARGS

      - name: Show audit
        if: always()
        run: |
          if [ -f public/cadastral/audit.json ]; then cat public/cadastral/audit.json; fi
          du -sh public/cadastral 2>/dev/null || true
          find public/cadastral/parcels -type f 2>/dev/null | wc -l || true

      - name: Commit cadastral results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cadastral public/boundaries/pio-rajac-cadastral-parcels.geojson || true
          if git diff --staged --quiet; then
            echo "No cadastral changes to commit."
            exit 0
          fi
          git commit -m "Cadastral Sentinel-2 update ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
