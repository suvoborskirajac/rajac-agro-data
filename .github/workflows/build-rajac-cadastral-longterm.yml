name: Build Rajac cadastral LONG-TERM

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Godina za obradu (2016-2026)'
        default: '2026'
        required: true
      month:
        description: 'Mesec 1-12; 0 = cela godina'
        default: '8'
        required: true
      force:
        description: 'Ponovo izracunaj vec postojeci mesec/godinu'
        type: boolean
        default: false
        required: false
      batch_size:
        description: 'Broj parcela u GEE reduceRegions batch-u'
        default: '750'
        required: false

permissions:
  contents: write

concurrency:
  group: rajac-cadastral-longterm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate existing cadastral input and active year
        env:
          YEAR: ${{ github.event.inputs.year || '2026' }}
        run: |
          python - <<'PY'
          import json, os
          y=int(os.environ['YEAR'])
          assert 2016 <= y <= 2026, 'Active long-term year must be 2016..2026'
          p='public/boundaries/pio-rajac-cadastral-parcels.geojson'
          g=json.load(open(p,encoding='utf-8'))
          f=g.get('features',[])
          ids=[str(x.get('properties',{}).get('parcela_id','')) for x in f]
          assert len(f)==2299, f'Expected 2299 parcels, got {len(f)}'
          assert len(set(ids))==2299 and all(ids), 'parcela_id missing/not unique'
          print('Input OK:',len(f),'parcels; year=',y)
          PY
      - name: Run monthly long-term processor
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          YEAR: ${{ github.event.inputs.year || '2026' }}
          MONTH: ${{ github.event.inputs.month || '8' }}
          FORCE_FLAG: ${{ github.event.inputs.force || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '750' }}
        run: |
          set -e
          ARGS="--year $YEAR --month $MONTH --batch-size $BATCH_SIZE"
          if [ "$FORCE_FLAG" = "true" ]; then ARGS="$ARGS --force"; fi
          python cadastral_longterm_processor.py $ARGS
      - name: Show audit
        if: always()
        run: |
          if [ -f public/cadastral-longterm/audit.json ]; then cat public/cadastral-longterm/audit.json; fi
      - name: Commit long-term results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cadastral-longterm || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Cadastral long-term ${YEAR}-${MONTH} ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
