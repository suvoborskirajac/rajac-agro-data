name: Build Rajac cadastral LONG-TERM ALL YEARS

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Pocetna godina'
        default: '2016'
        required: true
      end_year:
        description: 'Zavrsna godina'
        default: '2026'
        required: true
      force:
        description: 'Ponovo izracunaj vec postojece mesece'
        type: boolean
        default: false
        required: false
      batch_size:
        description: 'Broj parcela u GEE reduceRegions batch-u'
        default: '750'
        required: false

permissions:
  contents: write

concurrency:
  group: rajac-cadastral-longterm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate cadastral input
        run: |
          python - <<'PY'
          import json
          p='public/boundaries/pio-rajac-cadastral-parcels.geojson'
          g=json.load(open(p,encoding='utf-8'))
          f=g.get('features',[])
          ids=[str(x.get('properties',{}).get('parcela_id','')) for x in f]
          assert len(f)==2299, f'Expected 2299 parcels, got {len(f)}'
          assert len(set(ids))==2299 and all(ids), 'parcela_id missing/not unique'
          print('Input OK:',len(f),'parcels')
          PY

      - name: Backfill all requested years
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          START_YEAR: ${{ github.event.inputs.start_year || '2016' }}
          END_YEAR: ${{ github.event.inputs.end_year || '2026' }}
          FORCE_FLAG: ${{ github.event.inputs.force || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '750' }}
        run: |
          set -e

          if ! [[ "$START_YEAR" =~ ^[0-9]{4}$ && "$END_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid year input"
            exit 2
          fi
          if [ "$START_YEAR" -lt 2016 ] || [ "$END_YEAR" -gt 2026 ] || [ "$START_YEAR" -gt "$END_YEAR" ]; then
            echo "Year range must be 2016..2026"
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for Y in $(seq "$START_YEAR" "$END_YEAR"); do
            echo "============================================================"
            echo "YEAR $Y"
            echo "============================================================"

            ARGS="--year $Y --month 0 --batch-size $BATCH_SIZE"
            if [ "$FORCE_FLAG" = "true" ]; then
              ARGS="$ARGS --force"
            fi

            # Keep partial monthly results even if GEE fails later in the year.
            set +e
            python cadastral_longterm_processor.py $ARGS
            RC=$?
            set -e

            git add public/cadastral-longterm || true
            if ! git diff --staged --quiet; then
              git commit -m "Cadastral long-term year $Y ($(date -u +%Y-%m-%d))"

              PUSH_OK=0
              for ATTEMPT in 1 2 3; do
                echo "Push attempt $ATTEMPT for year $Y"
                if git pull --rebase origin main && git push origin HEAD:main; then
                  PUSH_OK=1
                  break
                fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              if [ "$PUSH_OK" -ne 1 ]; then
                echo "Could not push year $Y after 3 attempts"
                exit 3
              fi
            else
              echo "YEAR $Y: no new files to commit."
            fi

            if [ "$RC" -ne 0 ]; then
              echo "YEAR $Y failed with exit code $RC. Partial completed months were committed."
              exit "$RC"
            fi

            echo "YEAR $Y completed."
          done

      - name: Final audit
        if: always()
        run: |
          if [ -f public/cadastral-longterm/audit.json ]; then
            cat public/cadastral-longterm/audit.json
          fi
          du -sh public/cadastral-longterm 2>/dev/null || true
