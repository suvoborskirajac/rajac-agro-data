name: Build Rajac STATISTICAL CARDS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rajac-cadastral-statistical-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate long-term inputs
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('public/cadastral-longterm/stats')
          for y in range(2015,2027):
              for idx in ('NDVI','NDMI','RECI'):
                  p=root/str(y)/(idx+'_monthly.json')
                  assert p.exists(), f'Missing {p}'
                  j=json.load(open(p,encoding='utf-8'))
                  assert j.get('parcel_count_written')==2299, (p,j.get('parcel_count_written'))
          print('All 36 long-term files OK')
          PY

      - name: Build all 2,299 statistical cards
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python A_cadastral_statistical_cards.py

      - name: Audit outputs
        run: |
          cat public/cadastral-statistics/summary.json
          test "$(find public/cadastral-statistics/cards -name '*.json' | wc -l)" -eq 2299
          du -sh public/cadastral-statistics

      - name: Commit statistical outputs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cadastral-statistics
          if git diff --staged --quiet; then
            echo "No statistical changes."
            exit 0
          fi
          git commit -m "Rajac statistical cards ($(date -u +%Y-%m-%d))"
          for ATTEMPT in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 3
